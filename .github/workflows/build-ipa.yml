name: IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Decrypted YouTube IPA direct download URL"
        required: true
        default: ""
        type: string

      app_name:
        description: "App Name"
        required: true
        default: "YouTube"
        type: string

      bundle_id:
        description: "Bundle ID"
        required: true
        default: "com.google.ios.youtube"
        type: string

      # ── 추가 트윅 선택 ──────────────────────────────────────────────────
      include_ytvideoerroralert:
        description: "YTVideoErrorAlert"
        required: false
        default: true
        type: boolean

      include_donteatmycontent:
        description: "DontEatMyContent"
        required: false
        default: true
        type: boolean

      include_gonerino:
        description: "Gonerino"
        required: false
        default: true
        type: boolean

      include_yougetcaption:
        description: "YouGetCaption"
        required: false
        default: true
        type: boolean

      include_youchoosequality:
        description: "YouChooseQuality"
        required: false
        default: true
        type: boolean

      include_youquality:
        description: "YouQuality"
        required: false
        default: true
        type: boolean

      include_ytabconfig:
        description: "YTABConfig"
        required: false
        default: true
        type: boolean

      include_ytvideooverlay:
        description: "YTVideoOverlay"
        required: false
        default: true
        type: boolean

      include_yougroupsettings:
        description: "YouGroupSettings"
        required: false
        default: true
        type: boolean

      include_youtubedislikesreturn:
        description: "YouTubeDislikesReturn"
        required: false
        default: true
        type: boolean

      include_youpip:
        description: "YouPiP"
        required: false
        default: true
        type: boolean

      include_openyoutubeinsafari:
        description: "OpenYouTubeInSafari"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # ── 1단계: YTKACE .deb 빌드 ─────────────────────────────────────────────
  build:
    uses: ./.github/workflows/build-deb.yml

  # ── 2단계: IPA 패키징 ───────────────────────────────────────────────────
  package:
    needs: build
    runs-on: macos-latest
    outputs:
      ipa: ${{ steps.inject.outputs.ipa }}
      tweak_version: ${{ steps.inject.outputs.tweak_version }}
      youtube_version: ${{ steps.inject.outputs.youtube_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: YTKACE-deb-rootless
          path: packages

      - uses: levibostian/action-hide-sensitive-inputs@v1

      # ── 도구 설치 ──────────────────────────────────────────────────────
      - name: Setup tools
        run: brew install ldid dpkg

      # ── YouTube IPA 다운로드 ───────────────────────────────────────────
      - name: Download YouTube IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl --fail --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$IPA_URL" --output YouTube.ipa
          else
            curl --fail --location "$IPA_URL" --output YouTube.ipa
          fi
          file_type=$(file --mime-type -b YouTube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "Error: not a valid IPA (mime: $file_type)"
            exit 1
          fi

      # ── GitHub Releases에서 추가 트윅 .deb 다운로드 ────────────────────
      - name: Download extra tweak debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p extra-debs

          # GitHub 최신 릴리즈에서 .deb 다운로드 헬퍼
          # 사용법: download_gh_release <owner/repo> <저장파일명> [파일명_패턴]
          download_gh_release() {
            local repo="$1"
            local outfile="$2"
            local pattern="${3:-iphoneos-arm64\.deb}"
            local url
            url=$(curl -sf \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${repo}/releases/latest" \
              | python3 -c "
          import json, sys, re
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          pattern = r'${pattern}'
          # 패턴 일치 우선
          for a in assets:
              if re.search(pattern, a['name']):
                  print(a['browser_download_url']); break
          else:
              # fallback: 첫 번째 .deb
              for a in assets:
                  if a['name'].endswith('.deb'):
                      print(a['browser_download_url']); break
          " 2>/dev/null)
            if [[ -n "$url" ]]; then
              curl --fail --location "$url" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --output "extra-debs/${outfile}"
              echo "[OK] ${outfile} <- ${url}"
            else
              echo "[WARN] ${repo} 에서 릴리즈 에셋을 찾지 못했습니다. 건너뜁니다."
            fi
          }

          # YTVideoOverlay: YouPiP / YouQuality 중 하나라도 선택 시 필수
          if [[ "${{ inputs.include_ytvideooverlay }}" == "true" \
             || "${{ inputs.include_youpip }}"        == "true" \
             || "${{ inputs.include_youquality }}"    == "true" ]]; then
            download_gh_release "PoomSmart/YTVideoOverlay" "YTVideoOverlay.deb"
          fi

          [[ "${{ inputs.include_youpip }}"             == "true" ]] && \
            download_gh_release "PoomSmart/YouPiP"           "YouPiP.deb" || true

          [[ "${{ inputs.include_youchoosequality }}"   == "true" ]] && \
            download_gh_release "PoomSmart/YouChooseQuality" "YouChooseQuality.deb" || true

          [[ "${{ inputs.include_youquality }}"         == "true" ]] && \
            download_gh_release "PoomSmart/YouQuality"       "YouQuality.deb" || true

          [[ "${{ inputs.include_ytabconfig }}"         == "true" ]] && \
            download_gh_release "PoomSmart/YTABConfig"       "YTABConfig.deb" || true

          [[ "${{ inputs.include_yougroupsettings }}"   == "true" ]] && \
            download_gh_release "PoomSmart/YouGroupSettings" "YouGroupSettings.deb" || true

          [[ "${{ inputs.include_yougetcaption }}"      == "true" ]] && \
            download_gh_release "PoomSmart/YouGetCaption"    "YouGetCaption.deb" || true

          [[ "${{ inputs.include_ytvideoerroralert }}"  == "true" ]] && \
            download_gh_release "PoomSmart/YTVideoErrorAlert" "YTVideoErrorAlert.deb" || true

          [[ "${{ inputs.include_donteatmycontent }}"   == "true" ]] && \
            download_gh_release "therealFoxster/DontEatMyContent" "DontEatMyContent.deb" || true

          [[ "${{ inputs.include_gonerino }}"           == "true" ]] && \
            download_gh_release "castdrian/Gonerino"         "Gonerino.deb" || true

          echo "=== 다운로드 완료 ==="
          ls -lh extra-debs/ 2>/dev/null || echo "(없음)"

      # ── 저장소 내 tweaks/ 파일 스테이징 ────────────────────────────────
      # tweaks/ryd.deb                          → ReturnYouTubeDislike
      # tweaks/OpenYouTubeSafariExtension.appex → OpenYouTubeInSafari Safari Extension
      - name: Stage local tweaks from repository
        run: |
          # ReturnYouTubeDislike: tweaks/ryd.deb
          if [[ "${{ inputs.include_youtubedislikesreturn }}" == "true" ]]; then
            if [[ -f "tweaks/ryd.deb" ]]; then
              cp "tweaks/ryd.deb" "extra-debs/ReturnYouTubeDislike.deb"
              echo "[OK] tweaks/ryd.deb → extra-debs/ReturnYouTubeDislike.deb"
            else
              echo "[WARN] tweaks/ryd.deb 파일이 없습니다. ReturnYouTubeDislike를 건너뜁니다."
            fi
          fi

          # OpenYouTubeInSafari: tweaks/OpenYouTubeSafariExtension.appex
          # .appex는 extra-debs가 아닌 별도 경로에 보관 (주입 방식이 다름)
          # GitHub 웹 UI로 .appex(폴더/번들)를 업로드하면 브라우저가 폴더를
          # 그대로 올리지 못해 자동으로 .appex.zip으로 압축해버리므로,
          # .appex가 없고 .appex.zip만 있으면 여기서 압축을 풀어줍니다.
          if [[ "${{ inputs.include_openyoutubeinsafari }}" == "true" ]]; then
            if [[ -e "tweaks/OpenYouTubeSafariExtension.appex" ]]; then
              echo "[OK] tweaks/OpenYouTubeSafariExtension.appex 확인됨"
            elif [[ -f "tweaks/OpenYouTubeSafariExtension.appex.zip" ]]; then
              unzip -q "tweaks/OpenYouTubeSafariExtension.appex.zip" -d tweaks
              if [[ -e "tweaks/OpenYouTubeSafariExtension.appex" ]]; then
                echo "[OK] tweaks/OpenYouTubeSafariExtension.appex.zip → 압축 해제 완료"
              else
                echo "[WARN] tweaks/OpenYouTubeSafariExtension.appex.zip 압축을 풀었지만"
                echo "       OpenYouTubeSafariExtension.appex를 찾지 못했습니다. 건너뜁니다."
              fi
            else
              echo "[WARN] tweaks/OpenYouTubeSafariExtension.appex(.zip) 파일이 없습니다. OpenYouTubeInSafari를 건너뜁니다."
            fi
          fi

      # ── YTKACE 1차 주입 + 추가 트윅 2차 주입 ──────────────────────────
      - name: Inject YTKACE and extra tweaks
        id: inject
        env:
          APP_NAME:  ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail

          # ── YTKACE deb 풀기 ──
          deb_file="$(ls packages/*.deb | head -1)"
          mkdir deb-root
          dpkg-deb -x "$deb_file" deb-root
          export LDID="$(brew --prefix)/bin/ldid"

          # ── 버전 정보 추출 ──
          # dpkg-deb -x는 data만 추출하고 control 파일은 만들지 않으므로,
          # 기존의 "control" 파일을 직접 읽는 방식은 동작하지 않습니다.
          # dpkg-deb -f로 .deb 메타데이터에서 Version 필드를 바로 읽어옵니다.
          tweak_version="$(dpkg-deb -f "$deb_file" Version)"
          youtube_version="$(python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile('YouTube.ipa') as z:
              info = next(n for n in z.namelist()
                          if n.startswith('Payload/') and n.endswith('.app/Info.plist'))
              print(plistlib.loads(z.read(info))['CFBundleShortVersionString'])
          PY
          )"
          output="YTKACE_${tweak_version}_${youtube_version}.ipa"

          # ── 1차: YTKACE sideload-repack ──
          bash Scripts/sideload-repack.sh \
            YouTube.ipa \
            deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib \
            intermediate.ipa

          # ── 2차: 추가 트윅 주입 (dylib + appex) ──
          mkdir -p work-inject
          unzip -q intermediate.ipa -d work-inject
          APP_PATH="$(find work-inject/Payload -maxdepth 1 -type d -name '*.app' | head -1)"
          EXECUTABLE="$APP_PATH/$(python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              print(plistlib.load(f)['CFBundleExecutable'])
          PY
          )"
          mkdir -p "$APP_PATH/Frameworks"

          # ── Python: Mach-O load command 삽입 함수 ──
          cat > /tmp/inject_dylib.py << 'PYEOF'
          import sys, struct

          LC_LOAD_DYLIB = 0xC
          FAT_MAGIC_BE  = 0xCAFEBABE
          MH_MAGIC_64   = 0xFEEDFACF
          CPU_ARM64     = 0x0100000C

          def read_u32_le(data, off): return struct.unpack_from('<I', data, off)[0]
          def read_u32_be(data, off): return struct.unpack_from('>I', data, off)[0]
          def write_u32_le(data, off, val): struct.pack_into('<I', data, off, val)

          def inject_slice(data, base, rpath):
              """arm64 LE slice에 LC_LOAD_DYLIB 추가 (중복 방지)"""
              ncmds     = read_u32_le(data, base + 16)
              cmdsz     = read_u32_le(data, base + 20)
              off       = base + 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from('<II', data, off)
                  if cmd == LC_LOAD_DYLIB:
                      name_off = read_u32_le(data, off + 8)
                      existing = data[off + name_off: off + size].split(b'\x00')[0].decode('utf-8', 'replace')
                      if existing == rpath:
                          print(f"  이미 존재: {rpath}")
                          return
                  off += size

              # LC_LOAD_DYLIB 생성 (8바이트 정렬)
              name_off  = 24
              name_b    = rpath.encode() + b'\x00'
              padded    = (len(name_b) + 7) & ~7
              name_b    = name_b.ljust(padded, b'\x00')
              cmd_size  = name_off + padded
              lc        = struct.pack('<IIIII', LC_LOAD_DYLIB, cmd_size, name_off, 2, 0) + name_b

              write_u32_le(data, base + 16, ncmds + 1)
              write_u32_le(data, base + 20, cmdsz + cmd_size)

              insert_at = base + 32 + cmdsz
              data[insert_at:insert_at] = lc
              print(f"  삽입 완료: {rpath}")

          def process(binary_path, dylib_name):
              rpath = f"@rpath/{dylib_name}"
              with open(binary_path, 'rb') as f:
                  data = bytearray(f.read())

              magic = read_u32_be(data, 0)
              if magic == FAT_MAGIC_BE:
                  narch = read_u32_be(data, 4)
                  for i in range(narch):
                      entry = 8 + i * 20
                      cputype = read_u32_be(data, entry)
                      offset  = read_u32_be(data, entry + 8)
                      if cputype == CPU_ARM64:
                          inject_slice(data, offset, rpath)
                          break
              else:
                  inject_slice(data, 0, rpath)

              with open(binary_path, 'wb') as f:
                  f.write(data)

          process(sys.argv[1], sys.argv[2])
          PYEOF

          # ── .deb 파일 처리: dylib + bundle 추출 및 주입 ──
          if ls extra-debs/*.deb 1>/dev/null 2>&1; then
            mkdir -p extra-dylibs
            for deb in extra-debs/*.deb; do
              deb_name="$(basename "$deb" .deb)"
              extract_dir="extra-dylibs/${deb_name}"
              mkdir -p "$extract_dir"
              dpkg-deb -x "$deb" "$extract_dir"

              echo "--- ${deb_name} 처리 중 ---"

              # dylib 주입
              while IFS= read -r -d '' dylib; do
                dylib_name="$(basename "$dylib")"
                echo "  dylib 주입: $dylib_name"
                cp "$dylib" "$APP_PATH/Frameworks/$dylib_name"
                python3 /tmp/inject_dylib.py "$EXECUTABLE" "$dylib_name"
              done < <(find "$extract_dir" \
                -path "*/DynamicLibraries/*.dylib" -o \
                -path "*/MobileSubstrate/DynamicLibraries/*.dylib" | \
                grep -v '\.plist$' | tr '\n' '\0' | xargs -0 printf '%s\0')

              # dylib (경로 무관, 위 패턴 못 찾은 경우 fallback)
              while IFS= read -r -d '' dylib; do
                dylib_name="$(basename "$dylib")"
                dest="$APP_PATH/Frameworks/$dylib_name"
                if [[ ! -f "$dest" ]]; then
                  echo "  dylib fallback 주입: $dylib_name"
                  cp "$dylib" "$dest"
                  python3 /tmp/inject_dylib.py "$EXECUTABLE" "$dylib_name"
                fi
              done < <(find "$extract_dir" -name '*.dylib' -print0)

              # .bundle 복사
              while IFS= read -r -d '' bundle; do
                bundle_name="$(basename "$bundle")"
                echo "  bundle 복사: $bundle_name"
                cp -R "$bundle" "$APP_PATH/$bundle_name"
              done < <(find "$extract_dir" -name '*.bundle' -print0)

            done
          else
            echo "추가 .deb 없음, 건너뜁니다."
          fi

          # ── .appex 처리: PlugIns/ 에 복사 ────────────────────────────
          # OpenYouTubeSafariExtension.appex는 Safari Extension이므로
          # YouTube.app/PlugIns/ 아래에 위치해야 함
          if [[ "${{ inputs.include_openyoutubeinsafari }}" == "true" \
             && -e "tweaks/OpenYouTubeSafariExtension.appex" ]]; then
            echo "--- OpenYouTubeSafariExtension.appex 주입 ---"
            mkdir -p "$APP_PATH/PlugIns"
            cp -R "tweaks/OpenYouTubeSafariExtension.appex" \
                  "$APP_PATH/PlugIns/OpenYouTubeSafariExtension.appex"
            # appex 내 실행파일 서명
            APPEX_EXEC="$APP_PATH/PlugIns/OpenYouTubeSafariExtension.appex/OpenYouTubeSafariExtension"
            if [[ -f "$APPEX_EXEC" ]]; then
              "$LDID" -S "$APPEX_EXEC"
              echo "  appex 실행파일 서명 완료"
            fi
            echo "  PlugIns/ 복사 완료"
          fi

          # ── App Name 변경 ──────────────────────────────────────────────
          if [[ -n "$APP_NAME" && "$APP_NAME" != "YouTube" ]]; then
            python3 - "$APP_PATH/Info.plist" "$APP_NAME" <<'PY'
          import plistlib, sys
          path, name = sys.argv[1], sys.argv[2]
          with open(path, 'rb') as f:
              pl = plistlib.load(f)
          pl['CFBundleDisplayName'] = name
          pl['CFBundleName'] = name
          with open(path, 'wb') as f:
              plistlib.dump(pl, f)
          PY
            echo "App Name 변경: $APP_NAME"
          fi

          # ── Bundle ID 변경 ─────────────────────────────────────────────
          if [[ -n "$BUNDLE_ID" && "$BUNDLE_ID" != "com.google.ios.youtube" ]]; then
            python3 - "$APP_PATH/Info.plist" "$BUNDLE_ID" <<'PY'
          import plistlib, sys
          path, bid = sys.argv[1], sys.argv[2]
          with open(path, 'rb') as f:
              pl = plistlib.load(f)
          pl['CFBundleIdentifier'] = bid
          with open(path, 'wb') as f:
              plistlib.dump(pl, f)
          PY
            echo "Bundle ID 변경: $BUNDLE_ID"
          fi

          # ── 메인 실행파일 재서명 ───────────────────────────────────────
          "$LDID" -S "$EXECUTABLE"

          # ── 최종 IPA 패키징 ────────────────────────────────────────────
          rm -f intermediate.ipa
          (cd work-inject && zip -qry "../${output}" Payload)
          rm -rf work-inject /tmp/inject_dylib.py

          # ── 검증 ───────────────────────────────────────────────────────
          bash Tools/verify-artifacts.sh \
            deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib \
            "$output"

          echo "ipa=$output" >> "$GITHUB_OUTPUT"
          echo "tweak_version=$tweak_version" >> "$GITHUB_OUTPUT"
          echo "youtube_version=$youtube_version" >> "$GITHUB_OUTPUT"
          echo "=== 빌드 완료: $output ==="

      # ── 아티팩트 업로드 ────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: YTKACE-IPA
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error

  # ── 3단계: GitHub Release 자동 생성 ────────────────────────────────────
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 릴리즈 생성/에셋 업로드에는 write 권한이 필요합니다 (상단 기본값은 read)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YTKACE-IPA
          path: dist

      # ── 태그명 / 릴리즈 본문 생성 ────────────────────────────────────
      - name: Build release tag and notes
        id: meta
        env:
          TWEAK_VERSION:   ${{ needs.package.outputs.tweak_version }}
          YOUTUBE_VERSION: ${{ needs.package.outputs.youtube_version }}
        run: |
          set -euo pipefail

          tag="YTKACE_${TWEAK_VERSION}_${YOUTUBE_VERSION}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          {
            echo "body<<RELEASE_BODY_EOF"
            echo "Updated to YouTube v${YOUTUBE_VERSION}"
            echo ""
            echo "Included Tweaks:"
            echo ""
            echo "YTKACE"
            [[ "${{ inputs.include_ytvideoerroralert }}"     == "true" ]] && echo "YTVideoErrorAlert" || true
            [[ "${{ inputs.include_donteatmycontent }}"      == "true" ]] && echo "DontEatMyContent" || true
            [[ "${{ inputs.include_gonerino }}"              == "true" ]] && echo "Gonerino" || true
            [[ "${{ inputs.include_yougetcaption }}"         == "true" ]] && echo "YouGetCaption" || true
            [[ "${{ inputs.include_youchoosequality }}"      == "true" ]] && echo "YouChooseQuality" || true
            [[ "${{ inputs.include_youquality }}"            == "true" ]] && echo "YouQuality" || true
            [[ "${{ inputs.include_ytabconfig }}"            == "true" ]] && echo "YTABConfig" || true
            [[ "${{ inputs.include_ytvideooverlay }}"        == "true" ]] && echo "YTVideoOverlay" || true
            [[ "${{ inputs.include_yougroupsettings }}"      == "true" ]] && echo "YouGroupSettings" || true
            [[ "${{ inputs.include_youtubedislikesreturn }}" == "true" ]] && echo "Return YouTube Dislikes" || true
            [[ "${{ inputs.include_youpip }}"                == "true" ]] && echo "YouPiP" || true
            [[ "${{ inputs.include_openyoutubeinsafari }}"   == "true" ]] && echo "OpenYouTubeSafariExtension" || true
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 릴리즈 생성 + IPA 첨부 ────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.meta.outputs.body }}
          files: dist/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
